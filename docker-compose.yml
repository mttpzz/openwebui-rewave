services:
  # litellm
  litellm-db:
    image: postgres:16
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - openwebui-network

  litellm:
    image: ghcr.io/berriai/litellm:v1.88.1
    container_name: litellm
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "true"
      # API key for LLM provider (Anthropic)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Master key for litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # langfuse
      LANGFUSE_PUBLIC_KEY:  ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY:  ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST:        ${LANGFUSE_HOST}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on: [litellm-db]
    networks:
      - openwebui-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Playwright — for Web Search and Web Loader
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    container_name: playwright
    restart: unless-stopped
    command: /bin/sh -c "npx -y playwright@1.58.0 run-server --port 3000 --host 0.0.0.0"
    networks:
      - playwright-network
  
  # Docling — document text extraction (PDF/DOCX/XLSX/PPTX + OCR, tables/layout) for RAG / Knowledge Bases
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.20.0
    container_name: docling
    restart: unless-stopped
    networks:
      - openwebui-network

  # Open WebUI vector store — pgvector (RAG / Knowledge Bases)
  openwebui-vector-db:
    image: pgvector/pgvector:pg16
    container_name: openwebui-vector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: owui_vectors
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: ${OWUI_VECTOR_DB_PASSWORD}
    volumes:
      - openwebui-vector-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owui -d owui_vectors"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openwebui-network


  # Open WebUI — frontend chat
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: openwebui
    restart: unless-stopped
    volumes:
      - openwebui-data:/app/backend/data
      - ./caddy/caddy-root.crt:/usr/local/share/ca-certificates/caddy-root.crt:ro
    entrypoint: ["/bin/bash", "-c", "update-ca-certificates && exec bash start.sh"]
    environment:
      # caddy root certificate for secure communication with caddy reverse proxy
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt

      # litellm instead of OpenAI (proxy API)
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY:      ${LITELLM_MASTER_KEY}

      # disable ollama (using LiteLLM for all models)
      ENABLE_OLLAMA_API: "false"

      # Force single model exposure
      DEFAULT_MODELS: "rewave-ai"
      ENABLE_DIRECT_CONNECTIONS: "false"
      # Hide the built-in "Arena Model" evaluation entry from the model list
      ENABLE_EVALUATION_ARENA_MODELS: "false"

      # New-chat prompt suggestion cards (PersistentConfig: seeds a fresh DB only)
      DEFAULT_PROMPT_SUGGESTIONS: >
        [
          {"title": ["Cosa sai fare?", "scopri le funzioni"], "content": "Cosa sai fare? Elenca in modo sintetico come puoi aiutarmi nel lavoro quotidiano in Rewave."},
          {"title": ["Genera presentazione", "esempio presentazione"], "content": "/presentazione Genera una presentazione di esempio in 4 slide che illustra i servizi di Rewave Srl."}
        ]

      # Web Search — fallback when info not in wiki
      ENABLE_RAG_WEB_SEARCH: "true"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "duckduckgo"
      RAG_WEB_SEARCH_RESULT_COUNT: "5"
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: "10"
      ENABLE_SEARCH_QUERY_GENERATION: "true"
      
      # Web loader — content extraction from found URLs
      RAG_WEB_LOADER_ENGINE: "playwright"
      RAG_WEB_SEARCH_DOMAIN_FILTER_LIST: ""
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "true"
      BYPASS_WEB_SEARCH_WEB_LOADER: "false"
      RAG_WEB_SEARCH_TRUST_ENV: "true"
      PLAYWRIGHT_WS_URI: "ws://playwright:3000"

      # Vector store — pgvector instead of default embedded Chroma (scales, same postgres ops)
      VECTOR_DB: "pgvector"
      PGVECTOR_DB_URL: "postgresql://owui:${OWUI_VECTOR_DB_PASSWORD}@openwebui-vector-db:5432/owui_vectors"
      
      # Document extraction (Knowledge Bases + in-chat file upload) — Docling
      CONTENT_EXTRACTION_ENGINE: "docling"
      DOCLING_SERVER_URL: "http://docling:5001"   # verify docling-serve port (default 5001)
      # Multilingual embedding for Italian docs — local, CPU, downloaded on first use
      RAG_EMBEDDING_ENGINE: ""
      RAG_EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      # Upload limits
      RAG_FILE_MAX_SIZE: "50"     # MB per file
      RAG_FILE_MAX_COUNT: "10"    # files per chat
      # RAG retrieval tuning — also set in Admin UI (env only seeds a fresh DB)
      RAG_TOP_K: "5"
      ENABLE_RAG_HYBRID_SEARCH: "true"
      RAG_TOP_K_RERANKER: "5"
      RAG_HYBRID_BM25_WEIGHT: "0.5"
      # Workspace — all users can create Knowledge and share it with groups
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "true"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_SHARING: "true"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ALLOW_PUBLIC_SHARING: "false"
      
      # Hide the chat "Controls" panel from base users (no system prompt / params / valves override)
      USER_PERMISSIONS_CHAT_CONTROLS: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      USER_PERMISSIONS_CHAT_VALVES: "false"
      # Lock down features/actions not used by base users (off at model level too)
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_CALENDAR: "false"
      USER_PERMISSIONS_FEATURES_MEMORIES: "false"
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: "false"   # users only have rewave-ai
      USER_PERMISSIONS_CHAT_SHARE: "false"             # no public shareable chat links
      USER_PERMISSIONS_CHAT_EXPORT: "false"

      # security
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"
      
      # OAuth/SSO — Keycloak
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_CLIENT_ID:     ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI}
      OAUTH_PROVIDER_NAME: "Keycloak SSO"
      OAUTH_SCOPES: "openid email profile"
      WEBUI_URL: "https://oi.rewave.local"
      WEBUI_AUTH_SIGNOUT_REDIRECT_URL: "https://oi.rewave.local/auth"
      
      # map roles from Keycloak token to Open WebUI roles (optional)
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: "realm_access.roles"
      OAUTH_ALLOWED_ROLES: "user,admin"
      OAUTH_ADMIN_ROLES: "admin"
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      litellm:
        condition: service_healthy
      keycloak:
        condition: service_started
      playwright:
        condition: service_started
      docling:
        condition: service_started
      openwebui-vector-db:
        condition: service_healthy
    networks:
      - openwebui-network
      - playwright-network


  # Keycloak — Identity Provider (SSO)
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - openwebui-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://keycloak.rewave.local
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      - keycloak-db
    networks:
      - openwebui-network

  # n8n — workflow automation
  n8n-db:
    image: postgres:16
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    networks:
      - openwebui-network

  n8n:
    image: n8nio/n8n:2.25.7
    container_name: n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.rewave.local
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://n8n.rewave.local/
      N8N_PROXY_HOPS: 1
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Europe/Rome
      TZ: Europe/Rome
      # trust Caddy CA for calls to other internal services
      NODE_EXTRA_CA_CERTS: /opt/custom-certs/caddy-root.crt
      GMAIL_ACCOUNTS: ${GMAIL_ACCOUNTS}
      NODE_FUNCTION_ALLOW_EXTERNAL: "imap,mailparser"
      # kept false on purpose: mail-digest Code node reads GMAIL_ACCOUNTS from env;
      # blocking would force secrets into workflow JSON (plaintext in DB).
      # Single-editor instance -> accepted risk. Revisit if more n8n users are added.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      MAIL_TOPICS: ${MAIL_TOPICS}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./caddy/caddy-root.crt:/opt/custom-certs/caddy-root.crt:ro
    depends_on:
      - n8n-db
    networks:
      - openwebui-network


  # Reverse proxy TLS
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy-oi
    restart: unless-stopped
    ports:
      # - "80:80"  # comment on windows because port 80 is often used by other applications
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      openwebui-network:
        aliases:
          - oi.rewave.local
          - litellm.rewave.local
          - keycloak.rewave.local
          - n8n.rewave.local
    depends_on:
      - openwebui
      - litellm
      - keycloak
      - n8n


networks:
  openwebui-network:
    driver: bridge
  playwright-network:
    driver: bridge

volumes:
  litellm-db-data:
  openwebui-data:
  keycloak-db-data:
  caddy-data:
  caddy-config:
  n8n-data:
  n8n-db-data:
  openwebui-vector-db-data:
